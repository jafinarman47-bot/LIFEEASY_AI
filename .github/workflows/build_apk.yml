name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Recreate Modern Android v2 Structure
        run: |
          rm -rf android
          flutter create . --org com.lifeeasy --project-name lifeeasy_ai --platforms android
          sed -i 's/<uses-permission android:name="android.permission.INTERNET"\/>//g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="lifeeasy_ai"/android:label="LifeEasy AI"/g' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Completely Fix speech_to_text build.gradle
        run: |
          STT_GRADLE="$HOME/.pub-cache/hosted/pub.dev/speech_to_text-7.4.0/android/build.gradle"
          if [ -f "$STT_GRADLE" ]; then
            echo "Rewriting speech_to_text build.gradle completely..."
            printf "group 'com.surialagan.speechtotext'\nversion '1.0-SNAPSHOT'\n\nbuildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath 'com.android.tools.build:gradle:8.1.0'\n    }\n}\n\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n\napply plugin: 'com.android.library'\n\nandroid {\n    namespace 'com.surialagan.speechtotext'\n    compileSdk 34\n\n    defaultConfig {\n        minSdk 21\n        targetSdk 34\n    }\n    lintOptions {\n        disable 'InvalidPackage'\n    }\n}\n" > "$STT_GRADLE"
            echo "speech_to_text successfully patched!"
          else
            echo "Warning: speech_to_text build.gradle not found, but continuing..."
          fi

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Build release App Bundle (Play Store)
        run: flutter build appbundle --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lifeeasy-release-builds
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab
