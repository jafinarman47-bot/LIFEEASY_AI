name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Recreate Modern Android v2 Structure
        run: |
          rm -rf android
          flutter create . --org com.lifeeasy --project-name lifeeasy_ai --platforms android
          sed -i 's/<uses-permission android:name="android.permission.INTERNET"\/>//g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="lifeeasy_ai"/android:label="LifeEasy AI"/g' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Fix speech_to_text plugin compatibility
        run: |
          STT_GRADLE="$HOME/.pub-cache/hosted/pub.dev/speech_to_text-7.4.0/android/build.gradle"
          if [ -f "$STT_GRADLE" ]; then
            echo "Applying patch to speech_to_text build.gradle..."
            # Apply group and namespace/compileSdk fixes directly
            sed -i "s/flutter\.compileSdkVersion/34/g" "$STT_GRADLE"
            sed -i "s/flutter\.minSdkVersion/21/g" "$STT_GRADLE"
            sed -i "s/flutter\.targetSdkVersion/34/g" "$STT_GRADLE"
          else
            echo "speech_to_text build.gradle not found at expected path!"
          fi

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Build release App Bundle (Play Store)
        run: flutter build appbundle --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lifeeasy-release-builds
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab
